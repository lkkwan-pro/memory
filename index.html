<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F1 記憶大考驗</title>
    <style>
        :root { --bg: #2B2B2B; --card-bg: #E10600; --card-found: #4CAF50; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f0f0f0; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; touch-action: manipulation; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: var(--card-bg); margin: 0; font-size: 1.8rem; font-style: italic; }
        .stats { font-size: 1.2rem; font-weight: bold; color: #333; margin-top: 5px; }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 400px;
            width: 100%;
            perspective: 1000px; 
        }

        .card {
            width: 100%;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden; 
        }

        .card-back {
            background-color: var(--card-bg);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.1) 10px, rgba(0,0,0,0.1) 20px);
            color: white;
            font-size: 2rem;
        }

        .card-front {
            background-color: white;
            transform: rotateY(180deg);
            border: 3px solid var(--card-bg);
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        .card.matched .card-front {
            background-color: #e8ffe8;
            border-color: var(--card-found);
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
        }

        #resetBtn {
            margin-top: 30px;
            padding: 12px 25px;
            font-size: 1.2rem;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #resetBtn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏎️ 記憶大考驗</h2>
        <div class="stats">步數: <span id="moves">0</span></div>
    </div>

    <div class="game-board" id="board"></div>

    <button id="resetBtn" onclick="initGame()">重新開始</button>

    <script>
        // We now have TWO custom photos alongside the F1 emojis!
        const items = [
            '<img src="car1.jpg">', 
            '<img src="mother.jpg">',
            '🏆', '🏁', '🔧', '🚥', '🚓', '🚑'
        ];
        
        let cards = [...items, ...items]; 
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let isLocked = false;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            cards = shuffle(cards);
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            document.getElementById('moves').innerText = moves;
            isLocked = false;

            cards.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.item = item;
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-front">${item}</div>
                    <div class="card-back">?</div>
                `;
                
                card.onclick = () => flipCard(card);
                board.appendChild(card);
            });
        }

        function flipCard(card) {
            if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').innerText = moves;
                checkForMatch();
            }
        }

        function checkForMatch() {
            let isMatch = flippedCards[0].dataset.item === flippedCards[1].dataset.item;

            if (isMatch) {
                flippedCards[0].classList.add('matched');
                flippedCards[1].classList.add('matched');
                matchedPairs++;
                flippedCards = [];
                if (matchedPairs === items.length) {
                    setTimeout(() => alert(`恭喜！你用了 ${moves} 步完成！🎉`), 500);
                }
            } else {
                isLocked = true;
                setTimeout(() => {
                    flippedCards[0].classList.remove('flipped');
                    flippedCards[1].classList.remove('flipped');
                    flippedCards = [];
                    isLocked = false;
                }, 1000); 
            }
        }

        initGame();
    </script>
</body>
</html>
